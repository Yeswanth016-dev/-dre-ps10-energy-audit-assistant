<style>

.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;display:inline-block}

<script>
/* ===== CONFIG ===== */
const KEY='urjaVoiceData',CAT={motor:'⚙',fan:'💨',light:'💡',pump:'💧',fridge:'❄',other:'🔌'};
const NAV=[['dashboard','⌂','Dashboard'],['audit','🎙','Audit'],['appliances','⚙','Equipment'],['insights','💡','Insights'],['maintenance','🔧','Maintenance'],['reports','📄','Reports']];
const TE={dashboard:'డాష్‌బోర్డ్',audit:'ఎనర్జీ ఆడిట్',appliances:'పరికరాలు',insights:'సూచనలు',maintenance:'నిర్వహణ',reports:'నివేదికలు',settings:'సెట్టింగ్‌లు',start:'ఆడిట్ ప్రారంభించండి',tap:'మాట్లాడటానికి నొక్కండి',listen:'వింటున్నాం...',speak:'మాట్లాడండి',review:'పరికరాలను పరిశీలించండి',calcE:'ఎనర్జీ లెక్కించండి',daily:'రోజువారీ వినియోగం',monthly:'నెలవారీ వినియోగం',cost:'అంచనా ఖర్చు',startV:'వాయిస్ ఆడిట్ ప్రారంభించండి'};
const DEMO_TX='నా రైస్ మిల్లులో ఒక మోటార్ ఉంది. అది 2200 వాట్స్. రోజుకు 8 గంటలు నడుస్తుంది. మూడు ఫ్యాన్లు ఉన్నాయి. ఒక్కొక్కటి 70 వాట్స్. రోజుకు 10 గంటలు నడుస్తాయి. ఎనిమిది LED లైట్లు ఉన్నాయి. ఒక్కొక్కటి 12 వాట్స్. రోజుకు 8 గంటలు నడుస్తాయి. ఒక వాటర్ పంప్ ఉంది. అది 750 వాట్స్. రోజుకు 2 గంటలు నడుస్తుంది.';
const DEMO_TX_EN='I have a rice mill motor. It is 2200 watts. It runs 8 hours a day. There are three fans. Each is 70 watts. They run 10 hours a day. There are eight LED lights. Each is 12 watts. They run 8 hours a day. I have a water pump. It is 750 watts. It runs 2 hours a day.';
/* ===== STATE & STORAGE ===== */
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S,V='landing',mem=null,A={stage:'idle',tx:'',lang:'te',draft:[]};
const day=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
function demoData(){return{biz:{name:'Sri Lakshmi Rice Mill',type:'Rice Mill',loc:'Visakhapatnam, Andhra Pradesh',tariff:8.5,owner:'Ravi'},
items:[['Rice Mill Motor','motor',1,2200,8],['Ceiling Fan','fan',3,70,10],['LED Light','light',8,12,8],['Water Pump','pump',1,750,2]].map(([name,cat,qty,power,hours])=>({id:uid(),name,cat,qty,power,hours,source:'user_provided'})),
tasks:[{id:uid(),eq:'Audit',task:'Audit completed',due:day(0),done:true},{id:uid(),eq:'Rice Mill Motor',task:'Motor belt inspection',due:day(7),done:false},{id:uid(),eq:'Water Pump',task:'Pump leakage & wiring inspection',due:day(15),done:false},{id:uid(),eq:'LED Light',task:'Lighting system inspection',due:day(30),done:false}],ui:'en',synced:null}}
function load(){try{const r=localStorage.getItem(KEY);S=r?JSON.parse(r):(mem||demoData())}catch(e){S=mem||demoData()}save()}
function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
/* ===== CALCULATIONS (plain deterministic JS, no AI) ===== */
function calculateAppliance(a,tariff){const q=+a.qty,p=+a.power,h=+a.hours;
if(!(q>0)||!(p>0)||a.hours==null||!(h>=0&&h<=24)||!(tariff>=0))return null;
const dailyKwh=q*p*h/1000;return{dailyKwh,monthlyKwh:dailyKwh*30,monthlyCost:dailyKwh*30*tariff}}
function calculateAudit(list,tariff){const applianceResults=list.map(a=>({a,r:calculateAppliance(a,tariff)})).filter(x=>x.r);
const sum=k=>applianceResults.reduce((s,x)=>s+x.r[k],0);
const top=[...applianceResults].sort((x,y)=>y.r.monthlyKwh-x.r.monthlyKwh)[0];
return{totalDailyKwh:sum('dailyKwh'),totalMonthlyKwh:sum('monthlyKwh'),totalMonthlyCost:sum('monthlyCost'),applianceResults,topConsumer:top?top.a:null}}
const R=()=>calculateAudit(S.items,S.biz.tariff),f=(n,d=2)=>(+n).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d}),rs=n=>'₹'+f(n);
/* ===== LOCALIZATION ===== */
const t=(k,en)=>S.ui==='te'&&TE[k]?TE[k]:en;
/* ===== TOASTS & MODALS ===== */
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;$('#toasts').append(d);setTimeout(()=>d.remove(),2800)}
function modal(h){$('#modal').innerHTML='<div class="card">'+h+'</div>';$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on')}
/* ===== VOICE: MediaRecorder -> /api/transcribe -> Sarvam Speech-to-Text ===== */
const REC_OK=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder),MAX_REC_SEC=30;let recognition=null,isListening=false,finalTranscript='',recErr='';
const VM={ready:['Ready to listen','వినడానికి సిద్ధంగా ఉంది'],listening:['Recording...','రికార్డ్ అవుతోంది...'],captured:['Voice processed','వాయిస్ ప్రాసెస్ అయింది'],extract:['Extract Equipment','పరికరాలను గుర్తించండి'],demo:['Use Demo Input','డెమో ఇన్‌పుట్ ఉపయోగించండి'],another:['Record Another Audit','మరో ఆడిట్‌ను రికార్డ్ చేయండి'],
tapstart:['Start Voice Audit','వాయిస్ ఆడిట్ ప్రారంభించండి'],tapstop:['Recording... Tap to Stop','రికార్డింగ్... ఆపడానికి నొక్కండి'],uploading:['Uploading audio...','ఆడియో అప్‌లోడ్ అవుతోంది...'],transcribing:['Transcribing speech...','ప్రసంగాన్ని టెక్స్ట్‌గా మారుస్తోంది...'],
unsupported:['Microphone recording is not available in this browser.'],denied:['Microphone permission was denied. Please allow microphone access in your browser settings.'],nomic:['Microphone is not available on this device/browser.'],nospeech:['No speech was captured. Please try again.','వాయిస్ గుర్తించబడలేదు. మళ్లీ ప్రయత్నించండి.'],failed:['Unable to process voice right now. Try again, or use Manual Transcript or Demo Input.']};
const vt=k=>VM[k][S.ui==='te'?1:0]||VM[k][0];
const SRCL={microphone:'🎙️ LIVE MICROPHONE',demo:'🧪 DEMO INPUT',manual:'⌨️ MANUAL INPUT'};
const srcHTML=()=>A.src?SRCL[A.src]+(A.src==='demo'?' · predefined transcript':''):'';
function updSrc(){const b=$('#srcb');if(b){b.textContent=srcHTML();b.style.display=A.src?'':'none'}}
function setVS(vs,key){A.vs=vs;A.vkey=key;micUI()}
/* Clears ONLY the current voice session (never saved equipment/dashboard/maintenance/reports). Also invalidates any in-flight upload. */
let reqId=0,recorder=null,stream=null,chunks=[],recTimer=null,starting=false,recCancel=false;
function clearCurrentTranscript(){reqId++;A.tx='';A.src=null;A.vs='ready';A.vkey='';A.dbg='';finalTranscript='';const el=$('#tx');if(el)el.value='';updSrc()}
const MIMES=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];
function releaseStream(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function startLiveRecognition(){
if(!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window))return;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
try{
recognition=new SR();
recognition.lang=A.lang==='te'?'te-IN':'en-IN';
recognition.continuous=true;
recognition.interimResults=true;
recognition.maxAlternatives=1;
recognition.onresult=e=>{
let interim='';
for(let i=e.resultIndex;i<e.results.length;i++){
const text=e.results[i][0].transcript;
if(e.results[i].isFinal)finalTranscript+=text+' ';
else interim+=text;
}
const liveText=(finalTranscript+interim).trim();
A.tx=liveText;
const el=$('#tx');
if(el)el.value=liveText;
};
recognition.onerror=e=>{
console.log('[URJA] Live recognition:',e.error);
};
recognition.onend=()=>{
if(isListening&&recognition){
try{recognition.start()}catch(e){}
}
};
recognition.start();
}catch(e){
console.log('[URJA] Live recognition unavailable:',e);
recognition=null;
}
}

function stopLiveRecognition(){
if(recognition){
const r=recognition;
recognition=null;
try{r.onend=null;r.stop()}catch(e){}
}
}
/* ---- REAL microphone: first tap starts MediaRecorder, second tap stops it ---- */
async function startRec(){if(isListening||recorder||starting||A.vs==='processing')return;
clearCurrentTranscript();
finalTranscript='';
if(!REC_OK){setVS('error','unsupported');return}
starting=true;
try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){starting=false;A.dbg=e&&e.name;setVS('error',e&&(e.name==='NotAllowedError'||e.name==='SecurityError')?'denied':'nomic');return}
starting=false;
const mime=MIMES.find(m=>MediaRecorder.isTypeSupported(m))||'';
try{recorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream)}catch(e){releaseStream();recorder=null;A.dbg=String(e);setVS('error','nomic');return}
chunks=[];recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};recorder.onstop=onRecorded;
recorder.start();isListening=true;startLiveRecognition();console.log('[URJA] Recording started, type:',recorder.mimeType);
recTimer=setTimeout(()=>{if(isListening){toast('Maximum recording time reached.');stopRec()}},MAX_REC_SEC*1000);
setVS('listening')}
function stopRec(){if(recorder&&isListening){isListening=false;clearTimeout(recTimer);stopLiveRecognition();try{recorder.stop()}catch(e){}}}
function cancelRec(){if(recorder&&isListening){recCancel=true;stopLiveRecognition();stopRec()}else stopLiveRecognition()}
/* Browser -> 16 kHz mono WAV (a format Sarvam documents) */
async function toWav16k(blob){const AC=window.AudioContext||window.webkitAudioContext,ctx=new AC();let dec;try{dec=await ctx.decodeAudioData(await blob.arrayBuffer())}finally{if(ctx.close)ctx.close()}
const off=new OfflineAudioContext(1,Math.max(1,Math.ceil(dec.duration*16000)),16000),src=off.createBufferSource();src.buffer=dec;src.connect(off.destination);src.start();
const d=(await off.startRendering()).getChannelData(0),b=new ArrayBuffer(44+d.length*2),v=new DataView(b),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
w(0,'RIFF');v.setUint32(4,36+d.length*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,16000,true);v.setUint32(28,32000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,d.length*2,true);
for(let i=0;i<d.length;i++){const s=Math.max(-1,Math.min(1,d[i]));v.setInt16(44+i*2,s<0?s*0x8000:s*0x7fff,true)}
return new Blob([b],{type:'audio/wav'})}
async function onRecorded(){const type=(recorder&&recorder.mimeType)||'audio/webm';releaseStream();recorder=null;
const raw=new Blob(chunks,{type});chunks=[];
if(recCancel){recCancel=false;A.vs='ready';return}
if(!raw.size){setVS('error','nospeech');return}
const my=++reqId;setVS('processing','uploading');setTimeout(()=>{if(my===reqId&&A.vs==='processing')setVS('processing','transcribing')},900);
let up=raw,name='urja-audit.'+(type.includes('mp4')?'m4a':type.includes('ogg')?'ogg':'webm');
try{up=await toWav16k(raw);name='urja-audit.wav'}catch(e){console.log('[URJA] WAV conversion failed, sending original',e)}
const audioBytes=new Uint8Array(await up.arrayBuffer());
let binary='';
const CHUNK=0x8000;
for(let i=0;i<audioBytes.length;i+=CHUNK){
  binary+=String.fromCharCode(...audioBytes.subarray(i,Math.min(i+CHUNK,audioBytes.length)));
}
const audioBase64=btoa(binary);
const payload={
  audio:audioBase64,
  mimeType:up.type||'audio/wav',
  fileName:name,
  language:A.lang==='te'?'te-IN':'en-IN'
};
try{const r=await fetch('/api/transcribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});let j=null;try{j=await r.json()}catch(e){}
if(my!==reqId)return;
if(!r.ok||!j||!j.success){A.dbg=(j&&(j.code+': '+j.error))||('HTTP '+r.status+(location.protocol==='file:'?' (open the app through a server, not file://)':''));setVS('error','failed');return}
const text=String(j.text||'').trim();if(!text){setVS('error','nospeech');return}
A.tx=text;A.src='microphone';const el=$('#tx');if(el)el.value=text;console.log('[URJA] Sarvam transcript:',text);setVS('captured');toast('Transcript received.')}
catch(e){if(my!==reqId)return;A.dbg=String(e);setVS('error','failed')}}
function toggleRecording(){if(A.vs==='processing'||starting)return;if(!isListening)startRec();else stopRec()}
function micUI(){const m=$('#mic');if(!m)return;const L=A.vs==='listening',B=A.vs==='processing',C=A.vs==='captured',E=A.vs==='error';

function demoExtractAppliances(tx){const U=/^(వాట్|watt|w$|గంట|hour|hr)/i;
const w=tx.replace(/[.,।]/g,' ').split(/\s+/).filter(Boolean);
w.forEach((x,k)=>{if(NUM[x.toLowerCase()]&&w[k+1]&&U.test(w[k+1]))w[k]=String(NUM[x.toLowerCase()])});
const ix=[];w.forEach((x,i)=>{const k=KW.find(k=>k[0].test(x));if(k&&!(ix.length&&i-ix[ix.length-1][0]<=1))ix.push([i,k])});
return ix.map(([i,k],n)=>{const prev=n?ix[n-1][0]:-1,nx=n+1<ix.length?ix[n+1][0]:w.length;let q=1;
for(let j=i-1;j>=Math.max(i-3,prev+1);j--){const s=w[j].toLowerCase();if(/^\d+$/.test(s)&&!(w[j+1]&&U.test(w[j+1]))){q=+s;break}if(NUM[s]){q=NUM[s];break}}
const seg=w.slice(i+1,nx).join(' '),wm=seg.match(/(\d+(?:\.\d+)?)\s*(?:వాట్|watt|w\b)/i),hm=seg.match(/(\d+(?:\.\d+)?)\s*(?:గంట|hour|hr)/i),mill=w.slice(Math.max(0,i-4),i).some(x=>/మిల్|mill/i.test(x));
return{id:uid(),name:k[2]==='motor'&&mill?'Rice Mill Motor':k[1],cat:k[2],qty:q,power:wm?+wm[1]:null,hours:hm?+hm[1]:null,source:wm?'user_provided':'missing'}})}

function settings(){const b=S.biz;return`<h2>Settings</h2><br><div class="grid g2"><div class="card"><h3>Business Profile</h3><form id="pf"><label>Business name</label><input name="name" value="${esc(b.name)}"><label>Business type</label><input name="type" value="${esc(b.type)}"><label>Location</label><input name="loc" value="${esc(b.loc)}"><label>Electricity tariff (₹/kWh)</label><input name="tariff" type="number" step="0.01" min="0" value="${b.tariff}"><br><br><button type="submit">Save changes</button></form></div>
<div class="card"><h3>Integrations</h3><br>${[['Bhashini API','Demo Mode'],['LLM','Demo Mode'],['Supabase','Local Storage / Demo Mode']].map(x=>`<div class="row sp" style="margin:8px 0"><span>${x[0]}</span><span class="badge b-demo">${x[1]}</span></div>`).join('')}<p class="mut">Production deployment connects these adapters to the corresponding APIs. No keys are stored in this file.</p><br>
<div class="row"><button class="ghost" data-a="sync">Demo Sync</button><span class="mut">${S.synced?'Last: '+esc(S.synced):''}</span></div><br><button class="warn" data-a="reset">Reset Demo Data</button></div></div>`}
const VIEWS={landing,dashboard,audit,appliances,insights,maintenance,reports,settings};
/* ===== CHARTS ===== */
let chart=null;
function series(n){const fc=[.95,.98,1.01,.97,1.05,1.02,.9],T=R().totalDailyKwh,lab=[],d=[];for(let i=n-1;i>=0;i--){const dt=new Date();dt.setDate(dt.getDate()-i);lab.push(dt.toLocaleDateString('en-IN',{day:'numeric',month:'short'}));d.push(+(T*fc[(n-1-i)%7]).toFixed(2))}return{lab,d}}
function drawChart(n=7){const c=$('#ch');if(!c)return;const s=series(n);if(chart){chart.destroy();chart=null}
if(window.Chart){chart=new Chart(c,{type:'bar',data:{labels:s.lab,datasets:[{label:'Estimated kWh',data:s.d,backgroundColor:'#0b7f70',borderRadius:6}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}}}})}
else{c.style.display='none';const m=Math.max(...s.d);$('#chfb').innerHTML=s.d.map((v,i)=>`<div class="row sp mut"><span>${s.lab[i]}</span><div class="bar" style="flex:1"><b style="width:${v/m*100}%"></b></div><span>${v}</span></div>`).join('')}}
function counters(){document.querySelectorAll('[data-count]').forEach(el=>{const v=+el.dataset.count,d=+el.dataset.d,p=el.dataset.p,s=el.dataset.s,fin=()=>el.textContent=p+f(v,d)+s;
if(matchMedia('(prefers-reduced-motion:reduce)').matches)return fin();const t0=performance.now();(function st(n){const k=Math.min(1,(n-t0)/800);el.textContent=p+f(v*k,d)+s;if(k<1)requestAnimationFrame(st);else fin()})(t0)})}
/* ===== NAVIGATION & RENDER ===== */
function go(v){cancelRec();if(v==='audit'){clearCurrentTranscript();A.stage='idle';A.draft=[]}V=v;render();scrollTo(0,0)}
function render(){document.body.classList.toggle('landing',V==='landing');
try{$('#view').innerHTML=VIEWS[V]()}catch(e){$('#view').innerHTML='<div class="card"><h2>We couldn\'t process that yet</h2><button data-a="go" data-v="dashboard">Back to dashboard</button></div>'}
const nav=NAV.map(([k,i,l])=>`<a role="link" tabindex="0" class="${V===k?'on':''} ${k==='audit'?'c':''}" data-a="go" data-v="${k}"><span>${i}</span>${t(k,l)}</a>`).join('');
$('#side').innerHTML=`<div class="logo">URJA<br><span>VOICE</span></div><div style="color:#a7f3d0;margin-bottom:14px;font-size:13px">Speak. Audit. Save.</div>${nav}<div style="flex:1"></div><a tabindex="0" role="link" data-a="go" data-v="settings">⚙ ${t('settings','Settings')}</a><div style="padding:8px 12px">● ${online()?'Online':'Offline'}</div>`;
$('#bnav').innerHTML=nav;
$('#top').innerHTML=`<h2>${t(V,V[0].toUpperCase()+V.slice(1))}</h2><div class="row"><span class="mut" title="${online()?'Online — local data ready to sync.':"You're offline. Your audit data is safely stored on this device."}">${online()?'🟢 Online':'⚪ Offline'}</span><b>${esc(S.biz.name)}</b><button class="sm ghost" data-a="ui" aria-label="Switch language">${S.ui==='te'?'English':'తెలుగు'}</button><span aria-hidden="true">🔔 👤</span></div>`;
if(V==='dashboard'){counters();drawChart(7)}
const mic=$('#mic');if(mic){micUI();mic.addEventListener('click',toggleRecording)}
const pf=$('#pf');if(pf)pf.onsubmit=e=>{e.preventDefault();const d=new FormData(pf);Object.assign(S.biz,{name:d.get('name'),type:d.get('type'),loc:d.get('loc'),tariff:Math.max(0,+d.get('tariff')||0)});save();toast('Equipment updated.');render()}}
/* ===== APPLIANCES & FORMS ===== */
const findItem=id=>A.draft.find(x=>x.id===id)||S.items.find(x=>x.id===id);
function form(i,draft){const x=i||{name:'',cat:'other',qty:1,power:'',hours:''};
modal(`<h3>${i?'Edit':'Add'} equipment</h3><form id="ef"><label>Equipment name</label><input name="name" required value="${esc(x.name)}"><label>Category</label><select name="cat">${Object.keys(CAT).map(c=>`<option ${c===x.cat?'selected':''}>${c}</option>`).join('')}</select><label>Quantity</label><input name="qty" type="number" min="1" step="1" required value="${x.qty}"><label>Power (watts)</label><input name="power" type="number" min="1" step="any" value="${x.power??''}"><label>Hours per day</label><input name="hours" type="number" min="0" max="24" step="any" required value="${x.hours??''}"><div id="ferr" role="alert" style="color:#991b1b;font-size:13px;margin-top:6px"></div><br><div class="row"><button type="submit">Save</button><button type="button" class="ghost" data-a="close">Cancel</button></div></form>`);
$('#ef').onsubmit=e=>{e.preventDefault();const d=new FormData($('#ef')),o={name:d.get('name').trim(),cat:d.get('cat'),qty:+d.get('qty'),power:d.get('power')?+d.get('power'):null,hours:+d.get('hours')};
const er=!o.name?'Enter an equipment name.':!(o.qty>0)?'Quantity must be greater than 0.':(o.power!==null&&!(o.power>0))?'Power must be greater than 0 W.':(!(o.hours>=0&&o.hours<=24))?'Hours per day must be between 0 and 24.':'';if(er){$('#ferr').textContent=er;return}
if(i){const keep=i.source==='user_estimated'&&i.power===o.power;Object.assign(i,o,{source:o.power?(keep?'user_estimated':'user_provided'):'missing'})}
else(draft?A.draft:S.items).push({id:uid(),...o,source:o.power?'user_provided':'missing'});
save();closeModal();toast('Equipment updated.');render()}}
function powerPicker(i){const o=[['Small',500],['Medium',1000],['Heavy',2200]];
modal(`<h3>Power rating missing</h3><p class="mut">Choose an estimate for ${esc(i.name)}. It will be marked ESTIMATED, never as a value you gave.</p><br>${o.map(x=>`<button class="ghost" style="width:100%;margin-bottom:8px" data-a="pick" data-id="${i.id}" data-w="${x[1]}">${x[0]} ≈ ${x[1]} W</button>`).join('')}<label>Enter exact wattage</label><input id="ex" type="number" min="1"><br><br><div class="row"><button data-a="pick" data-id="${i.id}" data-w="exact">Use exact value</button><button class="ghost" data-a="close">I don't know</button></div>`)}
/* ===== AUDIT FLOW ===== */
async function processTx(){{const el=$('#tx');if(el)A.tx=el.value}if(!A.tx.trim()){toast('Add or speak a transcript first.');return}if(!A.src)A.src='manual';console.log('[URJA] Extracting from source:',A.src);
A.stage='processing';render();for(const l of [...document.querySelectorAll('#steps li')].slice(0,3)){await new Promise(r=>setTimeout(r,350));l.className='ok';l.textContent='✓ '+l.textContent.slice(2)}
await new Promise(r=>setTimeout(r,300));A.draft=demoExtractAppliances(A.tx);A.stage='review';
if(!A.draft.length)toast("We couldn't process that yet. Add equipment manually.");render()}
function calcDraft(){if(!A.draft.length){toast('Add at least one appliance.');return}
if(A.draft.some(i=>!(i.power>0))){toast('Power rating required before calculation.');return}
if(A.draft.some(i=>i.hours==null||!calculateAppliance(i,S.biz.tariff))){toast('Please review this equipment information.');return}
S.items=A.draft.map(x=>({...x}));save();A.stage='results';toast('Calculation completed.');render()}
/* ===== GUIDED 2-MINUTE DEMO ===== */
let demoRun=false;
let demoSkip=false;
async function runDemo(){if(demoRun)return;demoRun=true;demoSkip=false;S=demoData();save();A={stage:'idle',tx:'',lang:'te',draft:[]};
$('#demobar').style.display='block';
const steps=[['Voice Audit opened',()=>{V='audit'}],['Telugu transcript appears (explicit demo)',()=>{A.tx=DEMO_TX;A.src='demo'}],['Equipment extraction (demo mode)',()=>{A.draft=demoExtractAppliances(A.tx);A.stage='review'}],['Review screen: every value is verified by you',()=>{}],['Energy calculation (deterministic JavaScript)',()=>{S.items=A.draft.map(x=>({...x}));save();A.stage='results'}],['Dashboard updated',()=>{V='dashboard'}],['Insights',()=>{V='insights'}],['Maintenance plan',()=>{V='maintenance'}],['Energy audit report',()=>{V='reports'}]];
for(let i=0;i<steps.length&&!demoSkip;i++){$('#demotxt').innerHTML=`<b>${i+1} / ${steps.length}</b> ${steps[i][0]} <button class="sm ghost" data-a="skipDemo" style="float:right;min-height:32px">Skip Demo</button>`;$('#demoprog').style.width=((i+1)/steps.length*100)+'%';steps[i][1]();render();await new Promise(r=>setTimeout(r,2000))}
$('#demobar').style.display='none';demoRun=false;clearCurrentTranscript();if(demoSkip){A.stage='idle';A.draft=[];V='dashboard';render()}else toast('Report ready.')}
/* ===== ACTIONS (event delegation) ===== */
const ACT={
go:d=>go(d.v),runDemo,
ui:()=>{S.ui=S.ui==='te'?'en':'te';A.lang=S.ui;save();render()},
lang:d=>{A.lang=d.l;A.tx=($('#tx')||{}).value||A.tx;render()},
demoVoice:()=>{cancelRec();A.tx=A.lang==='te'?DEMO_TX:DEMO_TX_EN;A.src='demo';A.vs='ready';finalTranscript='';console.log('[URJA] Demo input explicitly selected');render();toast('Demo transcript loaded.')},
process:processTx,calc:calcDraft,
add:d=>form(null,!!d.d),
edit:d=>form(findItem(d.id),false),
del:d=>{A.draft=A.draft.filter(x=>x.id!==d.id);S.items=S.items.filter(x=>x.id!==d.id);save();toast('Equipment removed.');render()},
power:d=>powerPicker(findItem(d.id)),
pick:d=>{const i=findItem(d.id),w=d.w==='exact'?+($('#ex')||{}).value:+d.w;if(!(w>0)){toast('Please enter a valid wattage.');return}i.power=w;i.source='user_estimated';save();closeModal();toast('Equipment updated.');render()},
math:d=>{const e=$('#m'+d.n);if(e)e.hidden=!e.hidden},
range:d=>drawChart(+d.n),
done:d=>{S.tasks.find(x=>x.id===d.id).done=true;save();toast('Maintenance task completed.');render()},
resched:d=>{const x=S.tasks.find(x=>x.id===d.id),dt=new Date(x.due);dt.setDate(dt.getDate()+7);x.due=dt.toISOString().slice(0,10);save();toast('Task rescheduled.');render()},
addTask:()=>{modal(`<h3>Add maintenance task</h3><form id="tf"><label>Equipment</label><input name="eq" required><label>Task</label><input name="task" required><label>Due in (days)</label><input name="days" type="number" min="0" value="7"><br><div class="row"><button type="submit">Add Task</button><button type="button" class="ghost" data-a="close">Cancel</button></div></form>`);
$('#tf').onsubmit=e=>{e.preventDefault();const d=new FormData($('#tf'));S.tasks.push({id:uid(),eq:d.get('eq').trim(),task:d.get('task').trim(),due:day(Math.max(0,+d.get('days')||0)),done:false});save();closeModal();toast('Equipment updated.');render()}},
print:()=>window.print(),
download:()=>{const el=$('#report');if(!el)return;const h='<!DOCTYPE html><html><head><meta charset="utf-8"><title>URJA Voice Energy Audit Report</title><style>body{font-family:Arial,sans-serif;max-width:900px;margin:20px auto;padding:0 16px}table{width:100%;border-collapse:collapse}th,td{padding:6px;border-bottom:1px solid #ccc;text-align:left}.row{display:flex;justify-content:space-between}</style></head><body>'+el.outerHTML+'</body></html>';
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download='urja-voice-energy-audit-report.html';a.click();toast('Report ready.')},
sync:demoSync,
info:()=>modal(`<h3>Demo mode</h3><p class="mut">Voice uses your browser's speech recognition (not Bhashini). Extraction and recommendations are rule-based demos, not a live LLM. Data stays in this browser's local storage. All energy and cost numbers come from plain JavaScript formulas.</p><br><button data-a="close">Got it</button>`),
reset:()=>modal(`<h3>Reset Demo Data</h3><p class="mut">Reset the application to the default hackathon demo?</p><br><div class="row"><button class="ghost" data-a="close">Cancel</button><button class="warn" data-a="resetOk">Reset</button></div>`),
resetOk:()=>{S=demoData();A={stage:'idle',tx:'',lang:'te',draft:[]};save();closeModal();toast('Audit saved successfully.');render()},
close:closeModal,skipDemo:()=>{demoSkip=true;$('#demobar').style.display='none'},manual:()=>{const x=$('#tx');if(x)x.focus()},another:()=>{cancelRec();clearCurrentTranscript();A.stage='idle';A.draft=[];V='audit';render();scrollTo(0,0)}};
/* ===== EVENT LISTENERS ===== */
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&ACT[b.dataset.a])ACT[b.dataset.a](b.dataset,b)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches('a[data-a],span[data-a]')){e.preventDefault();e.target.click()}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
window.addEventListener('online',()=>{toast('Online — local data ready to sync.');render()});
window.addEventListener('offline',()=>{toast("You're offline. Your audit data is safely stored on this device.");render()});
document.addEventListener('change',e=>{if(e.target.id==='langsel'){A.tx=($('#tx')||{}).value||A.tx;A.lang=e.target.value;S.ui=A.lang;save();render()}});
document.addEventListener('input',e=>{if(e.target.id==='tx'&&A.vs!=='listening'){A.tx=e.target.value;A.src=A.tx.trim()?'manual':null;if(A.src)console.log('[URJA] Transcript source: MANUAL');updSrc()}});
/* ===== INIT ===== */
load();A.lang=S.ui||'en';clearCurrentTranscript();render();
</script>
